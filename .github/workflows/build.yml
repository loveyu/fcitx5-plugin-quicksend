name: Build

on:
  push:
    branches: [main, dev]
    tags: ['v*']

jobs:
  debug:
    name: Debug Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Replace mirror sources with official sources
        run: |
          sed -i 's|mirrors.cloud.tencent.com/gradle|services.gradle.org/distributions|g' gradle/wrapper/gradle-wrapper.properties
          sed -i '/maven.aliyun.com/d' settings.gradle.kts

      - name: Sherpa AAR version
        id: sherpaver
        run: |
          v=$(awk -F'"' '/sherpaAarVersion = "/{print $2; exit}' build.gradle.kts)
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - name: Restore Sherpa AAR cache
        uses: actions/cache@v4
        with:
          path: libs
          key: sherpa-aar-${{ steps.sherpaver.outputs.v }}

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickSendPlugin-${{ github.ref_name }}-debug
          path: build/outputs/apk/debug/*.apk
          retention-days: 30

  release:
    name: Release Build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Replace mirror sources with official sources
        run: |
          sed -i 's|mirrors.cloud.tencent.com/gradle|services.gradle.org/distributions|g' gradle/wrapper/gradle-wrapper.properties
          sed -i '/maven.aliyun.com/d' settings.gradle.kts

      - name: Setup keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Sherpa AAR version
        id: sherpaver
        run: |
          v=$(awk -F'"' '/sherpaAarVersion = "/{print $2; exit}' build.gradle.kts)
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - name: Restore Sherpa AAR cache
        uses: actions/cache@v4
        with:
          path: libs
          key: sherpa-aar-${{ steps.sherpaver.outputs.v }}

      - name: Build Release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLUGIN_VERSION: ${{ github.ref_name }}
        run: ./gradlew assembleRelease

      - name: Collect Release artifacts
        run: |
          set -e
          mkdir -p release-apks
          # APK 不再按 ABI 拆分（native 库改为运行时下载），只产出一个 universal 单包
          cp build/outputs/apk/release/*.apk "release-apks/QuickSendPlugin-${{ github.ref_name }}-release.apk"
          # 从 AAR 抽取各 ABI 的 4 个 .so 打成 zip 上传（zip 可避免裸 .so 被 Cloud/浏览器拦截）
          v=$(awk -F'"' '/sherpaAarVersion = "/{print $2; exit}' build.gradle.kts)
          tmp=$(mktemp -d)
          unzip -q libs/sherpa-onnx-$v.aar 'jni/*' -d "$tmp"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            (cd "$tmp/jni/$abi" && zip -q "$GITHUB_WORKSPACE/release-apks/sherpa-onnx-$v-$abi.zip" *.so)
          done
          rm -rf "$tmp"
          ls -la release-apks/

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QuickSendPlugin-${{ github.ref_name }}-release
          path: |
            release-apks/*.apk
            release-apks/*.zip
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-apks/*.apk
            release-apks/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
